name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node --experimental-strip-types packages/build/src/computeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: node-modules-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-${{ runner.arch }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - run: npm run build
      - run: npm test
      - run: npm run type-check
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run e2e:headless --workspace=@lvce-editor/wsl-e2e -- --filter=wsl.quickpick

  wsl_distributions:
    name: WSL (${{ matrix.distribution }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: Ubuntu-24.04
            setup-distribution: Ubuntu-24.04
            wsl-distribution: Ubuntu-24.04
          - distribution: kali-linux
            setup-distribution: kali-linux
            wsl-distribution: MyDistribution
          - distribution: archlinux
            setup-distribution: Ubuntu-24.04
            wsl-distribution: archlinux
    env:
      WSL_DISTRIBUTION: ${{ matrix.wsl-distribution }}
    steps:
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: ${{ matrix.setup-distribution }}
          use-cache: 'true'
          set-as-default: true
          wsl-version: 2
      - name: Install Arch Linux
        if: matrix.distribution == 'archlinux'
        shell: pwsh
        run: |
          function Invoke-WslUtf16 {
            param([string[]] $Arguments)
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = 'wsl.exe'
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $startInfo.StandardOutputEncoding = [System.Text.Encoding]::Unicode
            $startInfo.StandardErrorEncoding = [System.Text.Encoding]::Unicode
            foreach ($argument in $Arguments) { [void]$startInfo.ArgumentList.Add($argument) }
            $process = [System.Diagnostics.Process]::Start($startInfo)
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            $process.WaitForExit()
            [Console]::Out.Write($stdoutTask.GetAwaiter().GetResult())
            [Console]::Error.Write($stderrTask.GetAwaiter().GetResult())
            return $process.ExitCode
          }
          $exitCode = Invoke-WslUtf16 -Arguments @('--install', '--distribution', 'archlinux', '--no-launch')
          if ($exitCode -ne 0) { exit $exitCode }
          $exitCode = Invoke-WslUtf16 -Arguments @('--set-default', 'archlinux')
          if ($exitCode -ne 0) { exit $exitCode }
          $exitCode = Invoke-WslUtf16 -Arguments @('--unregister', 'Ubuntu-24.04')
          if ($exitCode -ne 0) { exit $exitCode }
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node --experimental-strip-types packages/build/src/computeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: node-modules-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-${{ runner.arch }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - name: Check selected WSL distribution
        shell: pwsh
        run: |
          function Invoke-WslUtf16 {
            param([string[]] $Arguments)
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = 'wsl.exe'
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $startInfo.StandardOutputEncoding = [System.Text.Encoding]::Unicode
            $startInfo.StandardErrorEncoding = [System.Text.Encoding]::Unicode
            foreach ($argument in $Arguments) { [void]$startInfo.ArgumentList.Add($argument) }
            $process = [System.Diagnostics.Process]::Start($startInfo)
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            $process.WaitForExit()
            [Console]::Out.Write($stdoutTask.GetAwaiter().GetResult())
            [Console]::Error.Write($stderrTask.GetAwaiter().GetResult())
            return $process.ExitCode
          }
          $exitCode = Invoke-WslUtf16 -Arguments @('--list', '--verbose')
          if ($exitCode -ne 0) { throw 'WSL is not available on this runner' }
          wsl.exe --distribution $env:WSL_DISTRIBUTION -- sh -lc 'cat /etc/os-release; uname -a'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run test:wsl
      - run: npm run build
      - name: Verify native terminal support
        run: npm test --workspace=@lvce-editor/wsl-server
      - name: Install Playwright browser
        run: npx playwright install chromium
      - run: npm run e2e:headless

  wsl:
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - wsl_distributions
    steps:
      - name: Require every WSL distribution job to pass
        run: |
          if [ "${{ needs.wsl_distributions.result }}" != "success" ]; then
            echo 'One or more WSL distribution jobs failed or were cancelled.'
            exit 1
          fi

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run type-check
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run e2e:headless --workspace=@lvce-editor/wsl-e2e -- --filter=wsl.quickpick

  wsl:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: Ubuntu-24.04
            setup-distribution: Ubuntu-24.04
          - distribution: kali-linux
            setup-distribution: kali-linux
          - distribution: archlinux
            setup-distribution: Ubuntu-24.04
    env:
      WSL_DISTRIBUTION: ${{ matrix.distribution }}
    steps:
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: ${{ matrix.setup-distribution }}
          use-cache: 'true'
          set-as-default: true
          wsl-version: 2
      - name: Install Arch Linux
        if: matrix.distribution == 'archlinux'
        shell: pwsh
        run: |
          wsl.exe --install --distribution archlinux --no-launch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl.exe --set-default archlinux
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl.exe --unregister Ubuntu-24.04
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check selected WSL distribution
        shell: pwsh
        run: |
          wsl.exe --list --verbose
          if ($LASTEXITCODE -ne 0) { throw 'WSL is not available on this runner' }
          wsl.exe --distribution $env:WSL_DISTRIBUTION -- sh -lc 'cat /etc/os-release; uname -a'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run test:wsl
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install chromium
      - run: npm run e2e:headless
